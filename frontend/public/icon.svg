<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Prologue</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073b38"/>
      <stop offset="0.5" stop-color="#0b5f5a"/>
      <stop offset="1" stop-color="#0b5a74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#5eead4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#021c1b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#021c1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdf7ef"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7f3e4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#011716" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Tile: deep teal, soft light from the top left, a fine highlight on the edge -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>
  <rect width="512" height="512" rx="118" fill="url(#depth)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="115.5" fill="none" stroke="url(#edge)" stroke-width="5"/>

  <!-- "P." — the first letter and the first full stop of a story -->
  <g filter="url(#lift)">
    <rect x="152" y="124" width="48" height="264" rx="24" fill="url(#ink)"/>
    <path d="M176 148 H246 A90 90 0 0 1 246 328 H200" fill="none" stroke="url(#ink)" stroke-width="48" stroke-linejoin="round"/>
    <circle cx="336" cy="366" r="22" fill="url(#dot)"/>
  </g>
</svg>
