# Local development stack. Values can be overridden in a .env file next to this one.
# Postgres and Redis are only reachable from the backend container, not from the host network.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prologue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myjob_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (reserved for caching and shared rate limits; not used by the API yet)
  redis:
    image: redis:7-alpine
    container_name: prologue_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prologue_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-myjob_db}
      - REDIS_URL=redis://redis:6379/0
      # Required (32+ random characters) when ENVIRONMENT=production; the dev default is refused there.
      - SECRET_KEY=${SECRET_KEY:-development-only-secret-key-do-not-use-in-production}
      # Set SEED_DEMO_DATA=true to load demo accounts (password: demo1234) into an empty DB.
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
