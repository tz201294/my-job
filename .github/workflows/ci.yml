name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Migrations apply cleanly
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: python -m alembic upgrade head

  # Production runs on Postgres (Neon), so everything is checked on Postgres too: the same version Neon uses by
  # default, and the database address in the form Neon gives it (postgresql://...?sslmode=...).
  backend-postgres:
    name: Backend on Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prologue
          POSTGRES_PASSWORD: prologue
          POSTGRES_DB: prologue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prologue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the migrations database
        env:
          PGPASSWORD: prologue
        run: psql -h localhost -U prologue -d prologue_test -c "CREATE DATABASE prologue_migrations"

      # Tables are dropped and recreated for every test (see tests/conftest.py).
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_test?sslmode=disable
        run: python -m pytest -q

      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_migrations?sslmode=disable
        run: python -m alembic upgrade head

      # Fails if a model was changed without a migration (or a migration doesn't match the models).
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_migrations?sslmode=disable
        run: python -m alembic check

      - name: Migrations can be undone and reapplied
        env:
          DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_migrations?sslmode=disable
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

      # The nightly backup (ops/backup.sh, .github/workflows/backup.yml) must really restore: back up a database
      # with data, restore it into an empty one, compare. A wrong passphrase must fail, and so must restoring over
      # a database that already has tables (that's how the live one is protected).
      - name: Backups restore
        env:
          DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_migrations?sslmode=disable
          TARGET_DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_restored?sslmode=disable
          SPARE_DATABASE_URL: postgresql://prologue:prologue@localhost:5432/prologue_spare?sslmode=disable
          BACKUP_PASSPHRASE: ci-only-passphrase
          PGPASSWORD: prologue
        run: |
          python -m scripts.seed_sample_data
          psql -h localhost -U prologue -d prologue_test -c "CREATE DATABASE prologue_restored"
          psql -h localhost -U prologue -d prologue_test -c "CREATE DATABASE prologue_spare"
          bash ../ops/backup.sh "$RUNNER_TEMP/backup"
          file="$(ls "$RUNNER_TEMP"/backup/*.dump.gpg)"
          bash ../ops/restore.sh "$file"
          for t in users posts post_comments qa_questions user_interests alembic_version; do
            a="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM $t")"
            b="$(psql "$TARGET_DATABASE_URL" -Atc "SELECT count(*) FROM $t")"
            echo "$t: $a in the original, $b restored"
            [ "$a" = "$b" ] && [ "$a" -gt 0 ]
          done
          if TARGET_DATABASE_URL="$SPARE_DATABASE_URL" BACKUP_PASSPHRASE=wrong bash ../ops/restore.sh "$file"; then
            echo "A wrong passphrase restored the backup"; exit 1
          fi
          if bash ../ops/restore.sh "$file"; then
            echo "Restoring over a database with tables was allowed"; exit 1
          fi
          echo "Backup round trip OK"

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
