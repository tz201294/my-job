name: Deploy MyJob to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Test
        run: |
          cd frontend
          npm test

      # The site lives under /my-job/ on GitHub Pages. Pages has no rewrite rules, so 404.html (a copy of the app)
      # serves direct links such as /my-job/u/sarah_plumber; the app then reads the address and shows that page.
      # With the repository variable VITE_API_URL set (Settings > Secrets and variables > Actions > Variables),
      # the site uses that API; without it, the site is the in-browser demo.
      - name: Build Application
        env:
          VITE_BASE: /my-job/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          cd frontend
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
