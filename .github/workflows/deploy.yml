name: Deploy Prologue to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Test
        run: |
          cd frontend
          npm test

      # The site lives under /my-job/ on GitHub Pages. Pages has no rewrite rules, so 404.html (a copy of the app)
      # serves direct links such as /my-job/u/sarah_plumber; the app then reads the address and shows that page.
      # Two versions of the site:
      #   /my-job/        the app. With the repository variable VITE_API_URL set (Settings > Secrets and variables >
      #                   Actions > Variables) it uses that API; without it, it is the in-browser demo too.
      #   /my-job/demo/   always the in-browser demo with sample accounts and posts.
      # 404.html (a copy of the app) serves direct links; links into /demo/ are handed on to the demo (spaFallback.js).
      # Error reporting is on when the repository variable VITE_SENTRY_DSN is set (docs/DEPLOY.md step 4).
      - name: Build Application
        env:
          VITE_BASE: /my-job/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_PATH: demo/
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: |
          cd frontend
          npm run build
          cp dist/index.html dist/404.html

      - name: Build Demo
        env:
          VITE_BASE: /my-job/demo/
          VITE_DEMO_MODE: 'true'
          # The demo links to the real app only when there is one.
          VITE_REAL_APP_URL: ${{ vars.VITE_API_URL && '/my-job/' || '' }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: |
          cd frontend
          npx vite build --outDir dist/demo --emptyOutDir

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
